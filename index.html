<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Havdoku</title>
<meta name="theme-color" content="#DDEFFC">
<meta name="description" content="Her satıra, sütuna ve renge bir köpek. Birbirine değmesinler.">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Havdoku">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one column toy — title, live rules strip, square board as the hero, chunky controls under it */
:root{
  --bg:#DDEFFC; --title:#FF7A1A; --tshadow:#8A93A6; --surface:#FFFFFF; --ink:#1E2433; --muted:#5B6478; --line:#1E2433; --accent:#2F6FEB; --bad:#E0364C; --good:#1F9D63;
  --r0:#F6C177; --r1:#9CCFD8; --r2:#C4A7E7; --r3:#F0B8B6; --r4:#A6D189; --r5:#F2A07B; --r6:#93B9F2; --r7:#E8E27D; --r8:#C9C3D6; --r9:#7FD1B9;
  --display:"Grandstander", "Trebuchet MS", system-ui, sans-serif;
  --body:"Grandstander", "Trebuchet MS", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141824; --surface:#1E2433; --ink:#EEF1F6; --muted:#A3ABBE; --line:#0B0E15; --accent:#6C9BFF; --bad:#FF5C70; --good:#3DD68C;
  --r0:#C99A55; --r1:#6FA4AE; --r2:#9A7FC2; --r3:#C08886; --r4:#7FA866; --r5:#C47A57; --r6:#6B90C9; --r7:#B7B25A; --r8:#8E889E; --r9:#58A892;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141824; --surface:#1E2433; --ink:#EEF1F6; --muted:#A3ABBE; --line:#0B0E15; --accent:#6C9BFF; --bad:#FF5C70; --good:#3DD68C;
  --r0:#C99A55; --r1:#6FA4AE; --r2:#9A7FC2; --r3:#C08886; --r4:#7FA866; --r5:#C47A57; --r6:#6B90C9; --r7:#B7B25A; --r8:#8E889E; --r9:#58A892;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.top{display:grid;grid-template-columns:auto auto 1fr auto;grid-template-areas:'logo title . diffs' 'stats stats stats ctrls';align-items:center;gap:14px 12px}
.top .logo{grid-area:logo}.top h1{grid-area:title}#diffs{grid-area:diffs}.stats{grid-area:stats}.controls{grid-area:ctrls}
.top .logo{width:64px;height:64px;flex:none;border-radius:50%;background:var(--r3);border:3px solid var(--line);overflow:hidden}
.top .logo img{width:100%;height:100%;display:block;object-fit:contain;transform:translateY(4px)}
h1{font-family:"Luckiest Guy",var(--display);font-weight:400;font-size:3rem;line-height:1;margin:0;padding-top:.12em;letter-spacing:.03em;color:var(--title);text-shadow:1.5px 1.5px 0 var(--tshadow);min-width:0}

.tag{color:var(--muted);font-weight:700;margin:4px 0 0;font-size:.95rem}
.rules{display:flex;flex-wrap:wrap;gap:6px}
.rules span{background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:4px 11px;font-weight:700;font-size:.85rem}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pickers{display:flex;flex-direction:column;gap:8px;align-items:center}
.sizes{display:flex;gap:4px;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:3px;box-shadow:0 3px 0 var(--line)}
.sizes button{font:800 .95rem var(--body);border:0;background:transparent;color:var(--ink);padding:6px 10px;border-radius:8px;cursor:pointer;font-variant-numeric:tabular-nums}
.sizes button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.stats{display:flex;gap:16px;font-weight:800;font-size:1.05rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.stats>div{display:flex;align-items:center;gap:5px}
.sico{width:20px;height:20px;flex:none;fill:none;stroke:var(--muted);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.dogico{width:22px;height:22px;object-fit:contain}
.stats .lbl{color:var(--muted);font-weight:700;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;margin-right:4px}
.boardwrap{position:relative}
#board{position:relative;display:grid;width:100%;aspect-ratio:1;max-width:100%;border:3px solid var(--line);border-radius:14px;overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;background:var(--line);}
.regions{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.regions path{fill:none;stroke:var(--line);stroke-linecap:round;stroke-linejoin:round}
.cell{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;border:0 solid color-mix(in srgb,var(--line) 40%,transparent);min-width:0;min-height:0;overflow:hidden}
.cell .x{position:absolute;width:46%;height:46%;opacity:.6}
.cell.bad .dog img{filter:drop-shadow(0 0 4px var(--bad))}
.cell .x.auto{opacity:.3}
.cell .dog{position:absolute;inset:2%;animation:pop .18s ease-out;pointer-events:none}
.cell .dog img{width:100%;height:100%;display:block;object-fit:contain;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.cell.won .dog{animation:bounce .5s ease-out both;animation-delay:calc(var(--k) * 60ms)}
@keyframes bounce{0%{transform:scale(1)}40%{transform:scale(1.18) rotate(-6deg)}100%{transform:scale(1)}}
.cell.bad::after{content:"";position:absolute;inset:0;z-index:-0;pointer-events:none;background:repeating-linear-gradient(45deg,transparent 0 6px,color-mix(in srgb,var(--bad) 45%,transparent) 6px 9px)}
.cell:focus-visible{outline:3px solid var(--accent);outline-offset:-3px;z-index:2}
@keyframes pop{from{transform:scale(.5)}to{transform:scale(1)}}
.controls{display:flex;justify-content:flex-end;gap:8px}
.ibtn{width:40px;height:40px;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center}
.ibtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.btn{font:800 .95rem var(--body);background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:11px 6px;cursor:pointer;box-shadow:0 3px 0 var(--line);transition:transform .06s}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.primary{background:var(--ink);color:var(--surface)}
.btn:focus-visible,.sizes button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opts{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.toggle{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.9rem;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.upload{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.upload label{font-weight:800;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.upload button{font:700 .85rem var(--body);background:none;border:0;color:var(--muted);cursor:pointer;text-decoration:underline}
.progress{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px;box-shadow:0 4px 0 var(--line)}
.progress h2{font-family:var(--display);font-weight:800;font-size:1.4rem;margin:0}
.phead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.where{font:800 1rem var(--body);color:var(--ink);background:none;border:0;padding:0;cursor:pointer;display:flex;align-items:center;gap:6px}
.where svg{width:14px;height:14px;fill:none;stroke:var(--muted);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.where:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.lbl-name{font-weight:800;color:var(--muted)}
.namecard form{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.namecard input{font:800 1.1rem var(--body);padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);text-align:center;width:100%}
.namecard input:focus{outline:3px solid var(--accent);outline-offset:1px}
.score{display:flex;gap:16px;align-items:center}
.badge{width:96px;height:96px;flex:none;border-radius:50%;background:var(--r7);border:3px solid var(--line);overflow:hidden}
.badge img{width:100%;height:100%;object-fit:contain;transform:translateY(6px)}
.smain{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.smain b{font-family:var(--display);font-weight:800;font-size:3rem;line-height:1;font-variant-numeric:tabular-nums}
.smain .unit{color:var(--muted);font-weight:800;margin-left:6px}
.smain b,.smain .unit{display:inline}
.title{font-weight:800;font-size:1.05rem}
.meter{height:10px;border:2px solid var(--line);border-radius:999px;overflow:hidden;background:var(--bg)}
.meter i{display:block;height:100%;background:var(--accent);width:0;transition:width .6s ease-out}
.next{color:var(--muted);font-size:.85rem;font-weight:700}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;align-items:end}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.75rem;font-weight:800;color:var(--muted)}
.day .col{width:100%;height:64px;display:flex;align-items:flex-end;background:var(--bg);border-radius:8px;overflow:hidden}
.day .col i{width:100%;background:var(--r4);border-top:2px solid var(--line)}
.day.today{color:var(--ink)}
.day.today .col{outline:2px solid var(--line);outline-offset:-2px}
.day .pts{font-variant-numeric:tabular-nums;color:var(--ink);min-height:1em}
.foot{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:.85rem;font-weight:700}
.gain{display:inline-block;margin-top:2px;font-family:var(--display);font-size:1.5rem;font-weight:800;color:var(--good)}
@media (prefers-reduced-motion:reduce){.meter i{transition:none}}
@media (max-width:420px){.badge{width:72px;height:72px}.smain b{font-size:2.4rem}}
.hint2{color:var(--muted);font-size:.8rem;font-weight:700}
.tblwrap{overflow-x:auto}
.lb{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.lb th{text-align:left;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;padding:6px 8px;border-bottom:2px solid var(--line)}
.lb td{padding:9px 8px;border-bottom:1px solid color-mix(in srgb,var(--line) 15%,transparent);font-weight:700}
.lb td:nth-child(3),.lb th:nth-child(3){text-align:right;font-weight:800}
.lb td:nth-child(4),.lb th:nth-child(4){text-align:right;color:var(--muted)}
.lb tr.me td{background:color-mix(in srgb,var(--title) 14%,transparent)}
.lb tr:first-child td:first-child{color:var(--title);font-weight:800}
.lb .empty{color:var(--muted);font-weight:700;text-align:center}
.help{color:var(--muted);font-size:.9rem;line-height:1.5;margin:0}
.win{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--bg) 70%,transparent);border-radius:14px}
.win .card{background:var(--surface);border:3px solid var(--line);border-radius:18px;padding:22px 26px;text-align:center;box-shadow:0 6px 0 var(--line);max-width:85%}
.win .card img{width:120px;height:120px;display:block;margin:-60px auto 4px}
.win h2{font-family:var(--display);font-size:2rem;margin:0 0 6px}
.win p{margin:0 0 14px;font-weight:700;color:var(--muted)}
.msg{min-height:1.3em;font-weight:800;text-align:center;margin:0;display:flex;align-items:center;justify-content:center;gap:8px}
.msg img{width:40px;height:40px}
.msg.err{color:var(--bad)}
@media (max-width:420px){h1{font-size:2.1rem;white-space:nowrap;text-shadow:1.5px 1.5px 0 var(--tshadow)}.stats{justify-content:center}.top{grid-template-columns:auto 1fr auto;grid-template-areas:'logo title title' 'diffs diffs ctrls' 'stats stats stats';gap:12px 8px}.top .logo{width:50px;height:50px}#diffs{display:flex;height:40px;align-items:stretch}#diffs button{flex:1;padding:0 6px;font-size:.85rem}.stats{gap:16px;font-size:1.05rem}.ibtn{width:40px;height:40px}}
@media (prefers-reduced-motion:reduce){.cell .dog{animation:none}.btn{transition:none}}

@media (max-width:380px){
  .win .card{padding:14px 16px;max-width:92%}
  .win .card img{width:76px;height:76px;margin:-44px auto 2px}
  .win h2{font-size:1.5rem;margin-bottom:4px}
  .win p{margin-bottom:10px}
  .namecard form{gap:8px}
  .namecard input{padding:8px 10px;font-size:1rem}
}
</style>
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>


<div class="wrap">
  <div class="top">
    <div class="logo" id="logo"></div>
    <h1>Havdoku</h1>
    <div class="sizes" id="diffs" role="group" aria-label="Zorluk"></div>
    <div class="stats"><div title="Izgara"><svg class="sico" viewBox="0 0 24 24" aria-label="Izgara"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M3.5 9.2h17M3.5 14.8h17M9.2 3.5v17M14.8 3.5v17"/></svg><span id="dim">7×7</span></div><div title="Süre"><svg class="sico" viewBox="0 0 24 24" aria-label="Süre"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9.5 2.5h5"/></svg><span id="time">0:00</span></div><div title="Köpek"><img class="dogico" id="dogIco" alt="Köpek"><span id="count">0/7</span></div></div>
    <div class="controls">
      <button class="btn ibtn" id="clear" title="Temizle" aria-label="Tahtayı temizle"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 3 12 10"/><path d="M12.5 9.5 14.5 11.5 11 20c-3 0-6-1.5-8-3.5l3.5-3.5z"/><path d="M6 17l2-2M9 19l1.5-2"/></svg></button>
      <button class="btn ibtn" id="new" title="Yeni bulmaca" aria-label="Yeni bulmaca"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h3.5c4 0 6.5 10 11 10H21"/><path d="M3 17h3.5c1.6 0 2.9-1.6 4-3.5M13.5 10.5c1.1-1.9 2.4-3.5 4-3.5H21"/><path d="m18 4 3 3-3 3M18 14l3 3-3 3"/></svg></button>
    </div>
  </div>

  <div class="boardwrap">
    <div id="board" role="grid" aria-label="Oyun tahtası"></div>
    <div class="win namecard" id="namecard" hidden>
      <div class="card">
        <img id="nameImg" alt="">
        <h2>Merhaba!</h2>
        <form id="nameForm">
          <label for="nameInput" class="lbl-name">Adın ne?</label>
          <input id="nameInput" maxlength="20" autocomplete="nickname" required>
          <button class="btn primary" type="submit">Başla</button>
        </form>
      </div>
    </div>
    <div class="win" id="win" hidden>
      <div class="card">
        <img id="winImg" alt="">
        <h2>Hav hav!</h2>
        <p id="winText">Çözdün.</p>
        <button class="btn primary" id="winNew">Yeni bulmaca</button>
      </div>
    </div>
  </div>
  <p class="msg" id="msg" aria-live="polite"></p>



  <div class="opts">
    <label class="toggle"><input type="checkbox" id="autox"> Otomatik çarpı</label>
  </div>

  <section class="progress" aria-labelledby="ph">
    <div class="phead"><h2 id="ph">Bu hafta</h2><button class="where" id="where" type="button" title="Adını değiştir"><span id="whoName"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg></button></div>
    <div class="score">
      <div class="badge" id="badge"></div>
      <div class="smain">
        <div><b id="wScore">0</b><span class="unit">puan</span></div>
        <div class="title" id="wTitle"></div>
        <div class="meter"><i id="meter"></i></div>
        <div class="next" id="wNext"></div>
      </div>
    </div>
    <div class="week" id="week" aria-label="Günlük puanlar"></div>
    <div class="foot"><span id="wLast"></span><span id="wBest"></span><span id="wReset"></span></div>
  </section>



</div>

// ---------- generator ----------
function rnd(n){return Math.floor(Math.random()*n)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
function placeQueens(n){
  const col=new Array(n).fill(-1),used=new Array(n).fill(false);
  (function go(r){if(r===n)return true;
    for(const c of shuffle([...Array(n).keys()])){
      if(used[c]||(r>0&&Math.abs(col[r-1]-c)<=1))continue;
      col[r]=c;used[c]=true;if(go(r+1))return true;used[c]=false;}
    return false})(0);
  return col;
}
function growRegions(n,q){
  const reg=new Array(n*n).fill(-1),w=[];
  for(let r=0;r<n;r++){reg[r*n+q[r]]=r;w.push(.4+Math.random()*1.6)}
  let left=n*n-n;
  while(left>0){
    let tot=0;for(const v of w)tot+=v;
    let x=Math.random()*tot,k=0;while(k<n-1&&x>w[k]){x-=w[k];k++}
    const cand=[];
    for(let i=0;i<n*n;i++)if(reg[i]===k){const r=(i/n)|0,c=i%n;
      for(const[dr,dc]of DIRS){const rr=r+dr,cc=c+dc;if(rr>=0&&rr<n&&cc>=0&&cc<n&&reg[rr*n+cc]===-1)cand.push(rr*n+cc)}}
    if(!cand.length){w[k]=1e-4;continue}
    reg[cand[rnd(cand.length)]]=k;left--;
  }
  return reg;
}
function findAlt(n,reg,q){
  const colU=new Array(n).fill(false),regU=new Array(n).fill(false),cur=[];let found=null;
  (function go(r,prev){if(found)return;
    if(r===n){if(cur.some((c,i)=>c!==q[i]))found=cur.slice();return}
    for(let c=0;c<n;c++){if(colU[c]||Math.abs(c-prev)<=1)continue;const g=reg[r*n+c];if(regU[g])continue;
      colU[c]=regU[g]=true;cur[r]=c;go(r+1,c);colU[c]=regU[g]=false;if(found)return}})(0,-5);
  return found;
}
function connectedWithout(n,reg,g,skip){
  const cells=[];for(let i=0;i<n*n;i++)if(reg[i]===g&&i!==skip)cells.push(i);
  if(!cells.length)return false;
  const seen=new Set([cells[0]]),st=[cells[0]];
  while(st.length){const i=st.pop(),r=(i/n)|0,c=i%n;
    for(const[dr,dc]of DIRS){const rr=r+dr,cc=c+dc,j=rr*n+cc;
      if(rr>=0&&rr<n&&cc>=0&&cc<n&&j!==skip&&reg[j]===g&&!seen.has(j)){seen.add(j);st.push(j)}}}
  return seen.size===cells.length;
}
function makeUnique(n,reg,q){
  for(let it=0;it<300;it++){
    const alt=findAlt(n,reg,q);if(!alt)return true;
    const cands=shuffle(alt.map((c,r)=>r*n+c).filter(i=>q[(i/n)|0]!==i%n));
    let ok=false;
    for(const x of cands){const g=reg[x],r=(x/n)|0,c=x%n;
      const nb=shuffle(DIRS.map(([dr,dc])=>[r+dr,c+dc]).filter(([rr,cc])=>rr>=0&&rr<n&&cc>=0&&cc<n).map(([rr,cc])=>reg[rr*n+cc]).filter(h=>h!==g));
      if(!nb.length||!connectedWithout(n,reg,g,x))continue;
      reg[x]=nb[0];ok=true;break}
    if(!ok)return false;
  }
  return false;
}
function generate(n){
  for(let t=0;t<2000;t++){const q=placeQueens(n),reg=growRegions(n,q);if(makeUnique(n,reg,q))return{reg,q}}
  return null;
}

// ---------- difficulty: which logical steps a human needs ----------
// 1 singles, 2 one unit confined to another, 3 a cell that would empty a unit, 4 2-3 units confined together
function rate(n,reg){
  const N=n*n,cand=new Array(N).fill(true),dog=new Array(N).fill(false);
  const rows=[],cols=[],regs=[...Array(n)].map(()=>[]);
  for(let r=0;r<n;r++){rows.push([...Array(n)].map((_,c)=>r*n+c));cols.push([...Array(n)].map((_,c)=>c*n+r))}
  for(let i=0;i<N;i++)regs[reg[i]].push(i);
  const units=[...rows,...cols,...regs];
  const K=[];for(let i=0;i<N;i++){const r=(i/n)|0,c=i%n,o=[];
    for(let j=0;j<N;j++){if(j===i)continue;const rr=(j/n)|0,cc=j%n;
      if(rr===r||cc===c||reg[j]===reg[i]||(Math.abs(rr-r)<=1&&Math.abs(cc-c)<=1))o.push(j)}K.push(o)}
  const has=u=>u.some(i=>dog[i]);
  let level=1,placed=0;
  for(let guard=0;guard<400;guard++){
    if(placed===n)return level;
    let did=false;
    for(const u of units){if(has(u))continue;const cs=u.filter(i=>cand[i]);if(!cs.length)return 9;
      if(cs.length===1){const i=cs[0];dog[i]=true;cand[i]=false;placed++;for(const j of K[i])cand[j]=false;did=true;break}}
    if(did)continue;
    for(const u of units){if(has(u))continue;const cs=u.filter(i=>cand[i]);
      for(const v of units){if(v===u||has(v))continue;
        if(cs.every(i=>v.includes(i)))for(const j of v)if(cand[j]&&!u.includes(j)){cand[j]=false;did=true}}
      if(did)break}
    if(did){level=Math.max(level,2);continue}
    for(let i=0;i<N&&!did;i++){if(!cand[i])continue;const ks=new Set(K[i]);
      for(const u of units){if(u.includes(i)||has(u))continue;
        if(u.filter(j=>cand[j]).every(j=>ks.has(j))){cand[i]=false;did=true;break}}}
    if(did){level=Math.max(level,3);continue}
    for(const[A,B]of[[regs,rows],[regs,cols],[rows,regs],[cols,regs]]){
      const open=A.filter(u=>!has(u)),combos=[];
      for(let a=0;a<open.length;a++)for(let b=a+1;b<open.length;b++){combos.push([open[a],open[b]]);for(let c=b+1;c<open.length;c++)combos.push([open[a],open[b],open[c]])}
      for(const cb of combos){const cs=cb.flatMap(u=>u.filter(i=>cand[i]));const hit=B.filter(v=>cs.some(i=>v.includes(i)));
        if(hit.length===cb.length)for(const v of hit)for(const j of v)if(cand[j]&&!cb.some(u=>u.includes(j))){cand[j]=false;did=true}
        if(did)break}
      if(did)break}
    if(did){level=Math.max(level,4);continue}
    return 9;
  }
  return 9;
}

const $=id=>document.getElementById(id);
const boardEl=$('board');
let S=null; // {n, reg, q, cells:[0 empty,1 x,2 dog], elapsed, solved, hints}
let history=[];
let autoX=lsGet('havdoku.autox')==='1';
$('autox').checked=autoX;

let diff=DIFF[lsGet('havdoku.diff')]?lsGet('havdoku.diff'):'orta';
let timerStart=0,timerId=null;

function save(){lsSet('havdoku.game',JSON.stringify(S))}
let genToken=0;
function newGame(){
  const n=DIFF[diff].sizes[rnd(DIFF[diff].sizes.length)];
  const token=++genToken,d=DIFF[diff],t0=Date.now();let best=null,bestScore=1e9;
  stopTimer();msg('Bulmaca hazırlanıyor…');boardEl.style.opacity='.4';boardEl.style.pointerEvents='none';
  (function step(){
    if(token!==genToken)return;
    const until=Date.now()+40;
    while(Date.now()<until){
      const g=generate(n);if(!g)continue;const l=rate(n,g.reg),sc=d.score(l);
      if(sc<bestScore){best=g;bestScore=sc}
      if(d.ok(l)){bestScore=0;break}
    }
    if(bestScore>0&&Date.now()-t0<5000){setTimeout(step,0);return}
    S={n,reg:best.reg,q:best.q,cells:new Array(n*n).fill(0),elapsed:0,solved:false,mood:rnd(6),diff,id:Date.now().toString(36)+rnd(1e6).toString(36)};
    history=[];lastTap=null;$('win').hidden=true;boardEl.style.opacity='';boardEl.style.pointerEvents='';
    msg('');renderProgress();
    buildBoard();render();startTimer();save();
  })();
}

function buildBoard(){
  const n=S.n;$('dim').textContent=n+'×'+n;boardEl.innerHTML='';
  boardEl.style.gridTemplateColumns='repeat('+n+',minmax(0,1fr))';boardEl.style.gridTemplateRows='repeat('+n+',minmax(0,1fr))';
  for(let i=0;i<n*n;i++){
    const r=(i/n)|0,c=i%n,g=S.reg[i];
    const d=document.createElement('div');
    d.className='cell';d.dataset.i=i;d.tabIndex=i===0?0:-1;d.setAttribute('role','gridcell');
    d.style.background='var(--r'+g+')';
    const up=r===0||S.reg[i-n]!==g,dn=r===n-1||S.reg[i+n]!==g,lf=c===0||S.reg[i-1]!==g,rt=c===n-1||S.reg[i+1]!==g;
    d.style.borderTopWidth=(r>0&&!up?.5:0)+'px';d.style.borderBottomWidth=(r<n-1&&!dn?.5:0)+'px';
    d.style.borderLeftWidth=(c>0&&!lf?.5:0)+'px';d.style.borderRightWidth=(c<n-1&&!rt?.5:0)+'px';
    // round only turns between two regions; board edges stay straight
    const R=(n>8?7:8)+'%',U=r>0&&up,D=r<n-1&&dn,L=c>0&&lf,T=c<n-1&&rt;
    if(U&&L)d.style.borderTopLeftRadius=R;if(U&&T)d.style.borderTopRightRadius=R;
    if(D&&L)d.style.borderBottomLeftRadius=R;if(D&&T)d.style.borderBottomRightRadius=R;
    boardEl.appendChild(d);
  }
  // region outlines drawn as one path with rounded turns
  let p='';
  for(let r=1;r<n;r++)for(let c=0;c<n;c++)if(S.reg[r*n+c]!==S.reg[(r-1)*n+c])p+='M'+c+' '+r+'H'+(c+1);
  for(let c=1;c<n;c++)for(let r=0;r<n;r++)if(S.reg[r*n+c]!==S.reg[r*n+c-1])p+='M'+c+' '+r+'V'+(r+1);
  const sw=n>8?.05:.06;
  boardEl.insertAdjacentHTML('beforeend','<svg class="regions" viewBox="0 0 '+n+' '+n+'" preserveAspectRatio="none" aria-hidden="true"><path d="'+p+'" stroke-width="'+sw+'"/></svg>');
}

function attacked(i){
  // is cell i excluded by some dog (not itself a dog)?
  const n=S.n,r=(i/n)|0,c=i%n;
  for(let j=0;j<n*n;j++){if(S.cells[j]!==2||j===i)continue;
    const rr=(j/n)|0,cc=j%n;
    if(rr===r||cc===c||S.reg[j]===S.reg[i]||(Math.abs(rr-r)<=1&&Math.abs(cc-c)<=1))return true}
  return false;
}
function conflicts(){
  const n=S.n,bad=new Set(),dogs=[];
  S.cells.forEach((v,i)=>{if(v===2)dogs.push(i)});
  for(let a=0;a<dogs.length;a++)for(let b=a+1;b<dogs.length;b++){
    const i=dogs[a],j=dogs[b],r1=(i/n)|0,c1=i%n,r2=(j/n)|0,c2=j%n;
    if(r1===r2||c1===c2||S.reg[i]===S.reg[j]||(Math.abs(r1-r2)<=1&&Math.abs(c1-c2)<=1)){bad.add(i);bad.add(j)}}
  return{bad,dogs};
}
function render(){
  const{bad,dogs}=conflicts();
  const kids=boardEl.children;
  for(let i=0;i<S.cells.length;i++){
    const v=S.cells[i],el=kids[i];
    let html='',label='boş';
    if(v===2){html='<div class="dog">'+dogHTML(dogFor(i,bad.has(i)))+'</div>';label='köpek'}
    else if(v===1){html=X_SVG;label='çarpı'}
    else if(autoX&&attacked(i)){html=X_SVG.replace('class="x"','class="x auto"');label='otomatik çarpı'}
    if(el.dataset.v!==String(v)+html.length||el._html!==html){el.innerHTML=html;el._html=html}
    el.dataset.v=String(v)+html.length;
    el.classList.toggle('bad',bad.has(i));
    el.setAttribute('aria-label',((i/S.n|0)+1)+'. satır, '+(i%S.n+1)+'. sütun: '+label);
  }
  $('count').textContent=dogs.length+'/'+S.n;
  if(!S.solved&&dogs.length===S.n&&bad.size===0){S.solved=true;stopTimer();save();
    dogs.forEach((i,k)=>{kids[i].style.setProperty('--k',k);kids[i].classList.add('won')});render();
    const prevBest=bestTime(S.diff);const dk=S.diff||'orta',gp=points(dk,S.elapsed);recordWin({id:S.id,d:dk,n:S.n,t:Math.round(S.elapsed),p:gp,at:Date.now()});
    $('winText').innerHTML='';$('winText').append(fmt(S.elapsed)+' sürede çözdün.'+(prevBest==null||S.elapsed<prevBest?' '+DIFF[dk].name+' rekorun!':''),document.createElement('br'));const gs=document.createElement('span');gs.className='gain';gs.textContent='+'+gp+' puan';$('winText').append(gs);
    setTimeout(()=>{$('win').hidden=false;$('winNew').focus()},250)}
}

// ---------- timer ----------
function fmt(s){s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function tick(){S.elapsed=(Date.now()-timerStart)/1000;$('time').textContent=fmt(S.elapsed)}
function startTimer(){stopTimer();$('time').textContent=fmt(S.elapsed);if(S.solved||!$('namecard').hidden)return;
  timerStart=Date.now()-S.elapsed*1000;timerId=setInterval(()=>{tick();if(Math.floor(S.elapsed)%5===0)save()},500)}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}
document.addEventListener('visibilitychange',()=>{if(!S||S.solved)return;if(document.hidden){if(timerId){tick();stopTimer();save()}}else startTimer()});

// ---------- input ----------
function pushHist(){history.push(S.cells.slice());if(history.length>300)history.shift()}
let drag=null,lastTap=null;
function cellAt(x,y){const el=document.elementFromPoint(x,y);const c=el&&el.closest('.cell');return c&&boardEl.contains(c)?+c.dataset.i:null}
boardEl.addEventListener('pointerdown',e=>{
  if(S.solved)return;const i=cellAt(e.clientX,e.clientY);if(i==null)return;
  e.preventDefault();
  const now=Date.now();let nv;
  if(lastTap&&lastTap.i===i&&now-lastTap.t<=500&&lastTap.from!==2){
    // double tap within half a second: dog (reuses the first tap's undo step)
    nv=2;lastTap=null;
  }else{
    pushHist();
    lastTap={i,t:now,from:S.cells[i]};
    nv=S.cells[i]===0?1:0;
  }
  S.cells[i]=nv;
  drag={mode:nv===1?'x':null,last:i};
  try{boardEl.setPointerCapture(e.pointerId)}catch(_){}
  render();save();
});
boardEl.addEventListener('pointermove',e=>{
  if(!drag||drag.mode!=='x')return;const i=cellAt(e.clientX,e.clientY);
  if(i==null||i===drag.last)return;drag.last=i;
  if(S.cells[i]===0){S.cells[i]=1;render()}
});
function endDrag(){if(drag){drag=null;save()}}
boardEl.addEventListener('pointerup',endDrag);boardEl.addEventListener('pointercancel',endDrag);
boardEl.addEventListener('keydown',e=>{
  const c=e.target.closest('.cell');if(!c)return;const i=+c.dataset.i,n=S.n;let j=null;
  if(e.key==='ArrowRight')j=i%n<n-1?i+1:i;else if(e.key==='ArrowLeft')j=i%n>0?i-1:i;
  else if(e.key==='ArrowDown')j=i+n<n*n?i+n:i;else if(e.key==='ArrowUp')j=i-n>=0?i-n:i;
  else if((e.key===' '||e.key==='Enter')&&!S.solved){e.preventDefault();pushHist();S.cells[i]=(S.cells[i]+1)%3;render();save();return}
  if(j!=null){e.preventDefault();c.tabIndex=-1;const t=boardEl.children[j];t.tabIndex=0;t.focus()}
});

function msg(t,err,face){const m=$('msg');m.innerHTML='';if(face){const im=new Image();im.src=IMG[face];im.alt='';m.appendChild(im)}m.appendChild(document.createTextNode(t));m.classList.toggle('err',!!err)}
$('clear').onclick=()=>{if(S.solved)return;pushHist();S.cells.fill(0);render();save();msg('')};
$('new').onclick=()=>newGame();
$('winNew').onclick=()=>newGame();
$('autox').onchange=e=>{autoX=e.target.checked;lsSet('havdoku.autox',autoX?'1':'0');render()};

Object.keys(DIFF).forEach(k=>{const b=document.createElement('button');b.textContent=DIFF[k].name;b.dataset.d=k;
  b.onclick=()=>{diff=k;lsSet('havdoku.diff',k);markDiff();newGame()};$('diffs').appendChild(b)});
function markDiff(){[...$('diffs').children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.d===diff?'true':'false'))}

$('logo').innerHTML=dogHTML('love');$('dogIco').src=IMG.face;$('winImg').src=IMG.party;

// ---------- progress (per player) ----------
let games=[];          // [{id,d,n,t,at}]
function loadLocal(){try{const a=JSON.parse(lsGet('havdoku.history'));return Array.isArray(a)?a:[]}catch(e){return[]}}
function saveLocal(){lsSet('havdoku.history',JSON.stringify(games.slice(-500)))}
function bestTime(d){const ts=games.filter(g=>g.d===d).map(g=>g.t);return ts.length?Math.min(...ts):null}
// score: base by difficulty, x2 when instant, x1 at par time, never below x0.5
const BASE={kolay:100,orta:200,zor:350},PAR={kolay:90,orta:150,zor:300};
function points(d,t){const f=Math.max(.5,Math.min(2,2-t/PAR[d]));return Math.round(BASE[d]*f)}
const ptsOf=g=>g.p!=null?g.p:points(g.d,g.t);
function weekStart(ms){const d=new Date(ms);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()}
const TIERS=[[0,'Uykulu yavru','meh'],[400,'Meraklı burun','confused'],[1200,'Yan bakışçı','sideeye'],[2500,'Havalı köpek','thuglife'],[4500,'Roket pati','rocket'],[7000,'Herkesin sevgilisi','love'],[10000,'Parti hayvanı','party']];
const DAYS=['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
function renderProgress(){
  const ws=weekStart(Date.now()),we=ws+7*864e5;
  const mine=games.filter(g=>g.at>=ws&&g.at<we),score=mine.reduce((a,g)=>a+ptsOf(g),0);
  $('wScore').textContent=score.toLocaleString('tr-TR');
  let ti=0;while(ti<TIERS.length-1&&score>=TIERS[ti+1][0])ti++;
  const [lo,name,face]=TIERS[ti],nx=TIERS[ti+1];
  $('wTitle').textContent=name;
  $('badge').innerHTML='<img alt="" src="'+IMG[face]+'">';
  $('meter').style.width=(nx?Math.min(100,(score-lo)/(nx[0]-lo)*100):100)+'%';
  $('wNext').textContent=nx?nx[1]+' için '+(nx[0]-score).toLocaleString('tr-TR')+' puan':'Zirvedesin';
  const daily=[0,0,0,0,0,0,0];mine.forEach(g=>{daily[Math.floor((g.at-ws)/864e5)]+=ptsOf(g)});
  const mx=Math.max(1,...daily),todayIdx=Math.floor((Date.now()-ws)/864e5);
  const wk=$('week');wk.innerHTML='';
  daily.forEach((p,i)=>{const d=document.createElement('div');d.className='day'+(i===todayIdx?' today':'');
    d.innerHTML='<span class="pts"></span><div class="col"><i></i></div><span></span>';
    d.querySelector('.pts').textContent=p?p:'';d.querySelector('i').style.height=(p/mx*100)+'%';
    d.lastChild.textContent=DAYS[i];wk.appendChild(d)});
  // past weeks
  const byWeek={};games.forEach(g=>{const k=weekStart(g.at);if(k<ws)byWeek[k]=(byWeek[k]||0)+ptsOf(g)});
  const last=byWeek[ws-7*864e5]||0,best=Math.max(0,...Object.values(byWeek));
  $('wLast').textContent='Geçen hafta: '+last.toLocaleString('tr-TR');
  $('wBest').textContent='En iyi hafta: '+Math.max(best,score).toLocaleString('tr-TR');
  const left=Math.ceil((we-Date.now())/864e5);
  $('wReset').textContent='Sıfırlanmaya '+(left<=1?'bugün son gün':left+' gün');
}
async function recordWin(g){
  if(games.some(x=>x.id===g.id))return;
  games.push(g);renderProgress();
  saveLocal();
  queueScore(g);
}
games=loadLocal();renderProgress();
// ---------- scores to the owner's Google Sheet ----------
const SCORE_URL='https://script.google.com/macros/s/AKfycbyvDJXs4XZ6GtQ_ZW51rkmY3Ai74uQ6c-BbRkJ6tYA0gXh5NyI1HUrYJMSKeJewvwkaVw/exec';
function loadOutbox(){try{const a=JSON.parse(lsGet('havdoku.outbox'));return Array.isArray(a)?a:[]}catch(e){return[]}}
function queueScore(g){const ob=loadOutbox();ob.push(Object.assign({name:playerName||'İsimsiz'},g));lsSet('havdoku.outbox',JSON.stringify(ob.slice(-100)));flushScores()}
let flushing=false;
async function flushScores(){
  if(flushing||!/^https:\/\/script\.google\.com\//.test(SCORE_URL))return;flushing=true;
  try{let ob=loadOutbox();
    while(ob.length){const g=ob[0];
      try{await fetch(SCORE_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(g)})}catch(e){break}
      ob=loadOutbox().filter(x=>x.id!==g.id);lsSet('havdoku.outbox',JSON.stringify(ob))}
  }finally{flushing=false}
}
window.addEventListener('online',flushScores);
setTimeout(flushScores,1500);

// ---------- player name ----------
let playerName=lsGet('havdoku.name')||'';
function showName(){$('whoName').textContent=playerName||'Adını yaz';}
function askName(){if(S&&!S.solved&&timerId){tick();stopTimer();save()}$('nameInput').value=playerName;$('nameImg').src=IMG.confused;$('namecard').hidden=false;setTimeout(()=>{try{$('nameInput').focus()}catch(e){}},50)}
$('where').onclick=askName;
$('nameForm').addEventListener('submit',async e=>{
  e.preventDefault();const v=$('nameInput').value.trim().slice(0,20);if(!v)return;
  playerName=v;lsSet('havdoku.name',v);showName();$('namecard').hidden=true;if(S&&!S.solved)startTimer();

});
showName();if(!playerName)askName();

// ---------- boot ----------
markDiff();
let saved=null;try{saved=JSON.parse(lsGet('havdoku.game'))}catch(e){}
if(saved&&saved.n&&saved.reg&&saved.mood!=null&&saved.cells&&saved.cells.length===saved.n*saved.n){
  S=saved;if(!(S.elapsed>=0&&S.elapsed<604800))S.elapsed=0;if(S.diff)diff=S.diff;markDiff();buildBoard();render();startTimer();if(S.solved){$('winText').textContent=fmt(S.elapsed)+' sürede çözdün.';$('win').hidden=false}
}else newGame();
})();
</script>
